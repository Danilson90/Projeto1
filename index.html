<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos - Dummy API</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Loja Exemplo (DummyJSON)</span>
            <button id="btn-recarregar" class="btn btn-outline-light btn-sm">Recarregar Dados</button>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="container">
        <!-- Barra de Pesquisa -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="input-group">
                    <input type="text" id="campo-busca" class="form-control" placeholder="Buscar produto (ex: phone, laptop, perfume)...">
                    <button id="btn-buscar" class="btn btn-primary">Buscar</button>
                </div>
            </div>
        </div>

        <!-- Indicador de Carregamento (Spinner) -->
        <div id="loading" class="text-center my-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2 text-muted">Buscando produtos na API...</p>
        </div>

        <!-- Mensagem de Erro (oculta por padrão) -->
        <div id="erro-msg" class="alert alert-danger d-none text-center" role="alert"></div>

        <!-- Grid onde os cards dos produtos serão inseridos -->
        <div id="lista-produtos" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
            <!-- Os cards via JS entram aqui -->
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Personalizado -->
    <script src="script.js"></script>
</body>
</html>
